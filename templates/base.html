<!doctype html>
<html>
    <head>
        <title>{% block title %}My Blog{% endblock %}</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
            integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/navbar.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/general.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/footer.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/about.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/contact.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/privacy.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/error.css') }}"
        />
    </head>
    <body>
        <div class="container">
            <nav class="nav__section">
                <div class="nav__container">
                    <div class="nav__links-box">
                        <ul class="nav__links">
                            <li class="nav__link">
                                <a href="{{url_for('home')}}">Home</a>
                            </li>
                            <li class="nav__link">
                                <a href="{{url_for('about')}}">About</a>
                            </li>
                            <li class="nav__link">
                                <a href="{{url_for('article')}}">Article</a>
                            </li>
                            <li class="nav__link">
                                <a href="{{url_for('contact')}}">Contact</a>
                            </li>
                        </ul>
                    </div>

                    <div class="nav__search-box">
                        <input
                            class="search"
                            type="search"
                            placeholder="Search..."
                        />
                        <button class="fa fa-search"></button>
                    </div>
                </div>
            </nav>

            {% block content %}{% endblock %}

            <footer class="footer__section">
                <div class="footer__container">
                    <div class="footer__box">
                        <div class="footer__sitemap">
                            <ul class="nav__links-footer">
                                <li><a href="{{url_for('home')}}">Home</a></li>
                                <li>
                                    <a href="{{url_for('about')}}">About</a>
                                </li>
                                <li>
                                    <a href="{{url_for('article')}}">Article</a>
                                </li>
                                <li>
                                    <a href="{{url_for('contact')}}">Contact</a>
                                </li>
                            </ul>
                        </div>

                        <div class="footer__socials">
                            <ul class="social-list">
                                <li class="social-list__item">
                                    <a
                                        class="social-list__link"
                                        href="https://facebook.com"
                                        target="_blank"
                                    >
                                        <i class="fa-brands fa-facebook"></i>
                                    </a>
                                </li>
                                <li class="social-list__item">
                                    <a
                                        class="social-list__link"
                                        href="https://twitter.com"
                                        target="_blank"
                                    >
                                        <i class="fa-brands fa-twitter"></i>
                                    </a>
                                </li>
                                <li class="social-list__item">
                                    <a
                                        class="social-list__link"
                                        href="https://github.com"
                                        target="_blank"
                                    >
                                        <i class="fa-brands fa-github"></i>
                                    </a>
                                </li>
                                <li class="social-list__item">
                                    <a
                                        class="social-list__link"
                                        href="https://youtube.com"
                                        target="_blank"
                                    >
                                        <i class="fa-brands fa-youtube"></i>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="footer__bottom">
                        <p>
                            &copy;
                            <span id="current-year">{{current_year}}</span>
                            The Blog. All rights reserved.
                        </p>

                        <a href="{{url_for('terms')}}">Terms and Conditions</a>
                        <a href="{{url_for('privacy')}}">Privacy Policy</a>
                    </div>
                </div>
            </footer>
        </div>
    </body>
</html>
